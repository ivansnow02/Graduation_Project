[project]
    dependencies=[
        "datasets",
        "dotenv>=0.9.9",
        "ipykernel>=7.1.0",
        "json-repair>=0.54.3",
        "jsonlines>=4.0.0",
        "litellm>=1.80.13",
        "modelscope>=1.36.3",
        "nltk>=3.9.2",
        "numpy<2.2",
        "openai>=2.14.0",
        "swanlab>=0.7.6",
        "tenacity>=9.1.2",
        "torch>=2.9.1",
        "transformers>=4.57.3",
        "unsloth>=2026.1.2",
        "xformers>=0.0.33.post2",
]
    description="SID Learning Platform: Train collaborative LLMs for interdisciplinary Socratic tutoring using multiturn-aware reward optimization"
    name="sid-learning-platform"
    readme="README.md"
    requires-python=">=3.11, <3.13"
    version="0.1.0"


[build-system]
    build-backend="setuptools.build_meta"
    requires     =["setuptools>=61.0", "wheel"]

# Restrict automatic package discovery to the actual Python package(s) to
# avoid accidental inclusion of top-level folders such as `data/` or
# `notebooks/` which triggered the error.
[tool.setuptools.packages.find]
    exclude=["data*", "notebooks*"]
    include=["collabllm*"]
    where  =["."]
    # set default index to utsc
